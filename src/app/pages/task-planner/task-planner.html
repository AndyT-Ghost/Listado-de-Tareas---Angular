<app-encabezado [texto]="titulo + ' de '  + nombre"></app-encabezado>

<div class="mensaje">
    <button (click)="alternarDescripcion()" class="boton-primario">Mostrar/Ocultar descripción</button>
    <p *ngIf="mostrarDescripcion">Lista de tareas del estudiante {{nombre}}</p>
</div>

<div class="tareas-container">
    <div class="tarea" *ngFor="let tarea of tareas">
        <div class="tarea-info">
        <h4>Tarea: #{{tarea.id}}</h4>
        <label>{{tarea.materia}}</label>
        <label>{{tarea.actividad}}</label>       
        <label [ngClass]="tarea.completada ? 'completada' : 'noCompletada'">
            {{tarea.completada ? 'Tarea finalizada' : 'Tarea no finalizada'}}
        </label>
        <label>Prioridad: <strong [ngClass]="{
            'prAlta': tarea.prioridad === 'Alta',
            'prMedia': tarea.prioridad === 'Media',
            'prBaja': tarea.prioridad === 'Baja'
            }">
            {{tarea.prioridad}}</strong></label>
        </div>
        
        <button (click)="cambiarEstado(tarea)" class="boton-primario">Cambiar estado</button>        
    </div>
    
</div>
